function positionCursors() {
  for (const { marker, data } of remoteCursors.values()) {

function connectCursors(db, database, authSdk, auth) {
  const cursors = db.ref(database, "whiteboard/cursors");
  let own = null, online = false, enabled = false, timer = 0;
  let pending = null, connectionVersion = 0;
  const forget = id => {
    remoteCursors.get(id)?.marker.remove();
    remoteCursors.delete(id);
  };
  const update = snapshot => {
    const data = snapshot.val();
    if (snapshot.key === own?.key || ![data?.x, data?.y, data?.updated].every(Number.isFinite)) {
      forget(snapshot.key);
      return;
    }
    const marker = remoteCursors.get(snapshot.key)?.marker || document.createElement("span");
    marker.className = data.touch ? "remote-cursor touch" : "remote-cursor";
    marker.textContent = cleanName(data.name) || "Гость";
    if (!marker.parentNode) cursorLayer.append(marker);
    remoteCursors.set(snapshot.key, { marker, data });
    positionCursors();
  };
  db.onChildAdded(cursors, update, () => {});
  db.onChildChanged(cursors, update, () => {});
  db.onChildRemoved(cursors, s => forget(s.key), () => {});
  setInterval(positionCursors, 3000);

  function attach() {
    const version = ++connectionVersion;
    enabled = false;
    if (!online || !auth.currentUser) return;
    own = db.push(cursors);
    db.onDisconnect(own).remove().then(() => {
      if (version === connectionVersion) enabled = true;
    }).catch(() => {});
  }
  db.onValue(db.ref(database, ".info/connected"), s => {
    online = s.val() === true;
    attach();
  });
  authSdk.onAuthStateChanged(auth, () => {
    if (enabled && own) db.remove(own).catch(() => {});
    attach();
  });
  shareCursor = (point, touch = false) => {
    if (!enabled || !own) return;
    if (!point) {
      clearTimeout(timer);
      timer = 0;
      pending = null;

const nameButton = document.querySelector("#name-button");
const namePanel = document.querySelector("#name-panel");

function cleanName(value) {
  return typeof value === "string" ? value.replace(/\s+/g, " ").trim().slice(0, 32) : "";
}
let undoing = false;
const camera = { x: 0, y: 0, zoom: 1, angle: 0, cos: 1, sin: 0 };
const actions = new Map();
const coarse = matchMedia("(pointer: coarse)");
const panel = document.querySelector("#panel");
const login = document.querySelector("#admin-login");
const adminTools = document.querySelector("#admin-tools");
const adminMessage = document.querySelector("#admin-message");
const clearBoard = document.querySelector("#clear-board");
const schemeFile = document.querySelector("#scheme-file");
const schemeRemove = document.querySelector("#scheme-remove");
let reference = document.querySelector("#reference");
const schemeToggle = document.querySelector("#scheme-toggle");
const schemeTransparency = document.querySelector("#scheme-transparency");
const schemePlayback = document.querySelector("#scheme-playback");
const schemePlay = document.querySelector("#scheme-play");
const schemeTime = document.querySelector("#scheme-time");
let schemeLoad = 0;
let scheme = null;
let adminAvailable = false;
let taps = 0, lastTap = 0;
let streamTimer = 0, lastStream = -Infinity;
status.onclick = () => {
  const now = performance.now();
  taps = now - lastTap < 650 ? taps + 1 : 1;
  lastTap = now;
  if (taps !== 7) return;
  taps = 0;
  if (!adminAvailable) adminMessage.textContent = "Вход пока недоступен";
  if (!panel.open) panel.showModal();
};
document.querySelector("#scheme").onclick = () => schemeFile.click();
function refreshSchemeControls() {
  const video = scheme?.video ? reference : null;
  schemeToggle.disabled = schemeTransparency.disabled = schemeRemove.disabled = !scheme;
  schemeToggle.textContent = reference.hidden && scheme ? "Показать схему" : "Скрыть схему";
  reference.style.opacity = String(1 - Number(schemeTransparency.value) / 100);
  schemePlayback.hidden = !video || reference.hidden;

}

function playScheme() {
  reference.play().catch(() => refreshSchemeControls());
}

schemeToggle.onclick = () => {
  if (!scheme) return;
  reference.hidden = !reference.hidden;
  if (scheme.video) {
    if (reference.hidden) {
      scheme.resume = !reference.paused;
      reference.pause();
    } else if (scheme.resume) playScheme();
  }
  refreshSchemeControls();
};
schemeTransparency.oninput = refreshSchemeControls;
schemePlay.onclick = () => {
  if (!scheme?.video) return;
  if (reference.paused) playScheme();
  else reference.pause();
};
function seekScheme(time) {
  if (!scheme?.video || !Number.isFinite(reference.duration)) return;
  reference.pause();
  reference.currentTime = Math.max(0, Math.min(reference.duration, time));
  refreshSchemeControls();
}
schemeTime.oninput = () => seekScheme(Number(schemeTime.value));
document.querySelector("#scheme-back").onclick = () => seekScheme(reference.currentTime - .1);
document.querySelector("#scheme-forward").onclick = () => seekScheme(reference.currentTime + .1);

function releaseScheme() {
  if (!scheme) return;
  if (scheme.video) reference.pause();
  reference.hidden = true;
  reference.removeAttribute("src");
  if (scheme.video) reference.load();
  URL.revokeObjectURL(scheme.url);
  scheme = null;
}
schemeRemove.onclick = () => {
  ++schemeLoad;
  releaseScheme();
  refreshSchemeControls();
};

schemeFile.onchange = async () => {
  const file = schemeFile.files[0];
  schemeFile.value = "";
  if (!file) return;
  const version = ++schemeLoad;
  const url = URL.createObjectURL(file);
  const video = file.type.startsWith("video/") || /\.(mp4|webm|mov|m4v|ogv)$/i.test(file.name);
  const media = video ? document.createElement("video") : new Image();
  let timer;
  try {
    if (video) {
      media.muted = media.playsInline = media.loop = true;
      media.preload = "auto";
      await new Promise((resolve, reject) => {
        media.onloadedmetadata = resolve;
        media.onerror = reject;
        timer = setTimeout(reject, 15000);
        media.src = url;

    } else {
      media.alt = "";
      media.src = url;
      await media.decode();
    }
    if (version !== schemeLoad) {
      URL.revokeObjectURL(url);
      return;

    const width = video ? media.videoWidth : media.naturalWidth;
    const height = video ? media.videoHeight : media.naturalHeight;
    if (!width || !height) throw new Error("missing dimensions");
    const cos = Math.abs(camera.cos), sin = Math.abs(camera.sin);
    const projectedWidth = width * cos + height * sin;
    const projectedHeight = width * sin + height * cos;
    const scale = Math.min(board.clientWidth * .85 / projectedWidth,
      board.clientHeight * .8 / projectedHeight, 1) / camera.zoom;
    const w = width * scale, h = height * scale;
    const [cx, cy] = world([board.clientWidth / 2, board.clientHeight / 2]);
    releaseScheme();
    scheme = { url, video, x: cx - w / 2, y: cy - h / 2, w, h };

    reference.replaceWith(media);
    reference = media;
    if (video) {
      media.onloadedmetadata = media.onerror = null;
      media.onplay = media.onpause = media.ontimeupdate = refreshSchemeControls;
    }
    positionScheme();
    refreshSchemeControls();
    if (video) playScheme();
    adminMessage.textContent = "";
  } catch {
    URL.revokeObjectURL(url);
    if (version === schemeLoad) adminMessage.textContent = "Браузер не смог открыть этот файл.";
  } finally {
    clearTimeout(timer);
  }

async function connect() {
  if (!firebaseConfig.databaseURL) { status.textContent = "Локальная доска · Укажи databaseURL"; return; }
  try {
    const [{ initializeApp }, db, authSdk] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js"),
      import("https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js")
    ]);
    const app = initializeApp(firebaseConfig);
    const database = db.getDatabase(app);
    const auth = authSdk.getAuth(app);
    await auth.authStateReady();
    if (!auth.currentUser) await authSdk.signInAnonymously(auth).catch(() => {});
    configurePanel(authSdk, auth, db, database);
    connectCursors(db, database, authSdk, auth);
    const log = db.ref(database, "whiteboard/actions");
    let ready = false, online = false, denied = false, writeError = false;
    const report = () => {
      status.textContent = denied ? "Локальная доска · Доступ к базе закрыт" : writeError ? "Не удалось сохранить изменение"

    };
    const fail = () => { loading = false; denied = true; writeAction = null; report(); };
    db.onValue(db.ref(database, ".info/connected"), s => { online = s.val(); report(); });
    db.onChildAdded(log, s => { if (!actions.has(s.key)) receive(s.key, s.val()); }, fail);

    db.onChildRemoved(log, s => remove(s.key), fail);

      loading = false;
      ready = true;
      writeAction = (action, image) => {
        const item = db.push(log);
        receive(item.key, action, image);

function configurePanel(authSdk, auth, db, database) {
  const admin = db.ref(database, "adminUid");
  let adminUid = null;
  let accountVersion = 0;
  adminAvailable = true;
  adminMessage.textContent = "";
  let signingIn = false;
  const submit = login.querySelector("button");

  async function withDeadline(request) {
    let timer;
    try {
      return await Promise.race([
        request,
        new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error("deadline")), 12000);
        })
      ]);
    } finally {
      clearTimeout(timer);
    }
  }

  async function checkAccess(user) {
    const version = ++accountVersion;
    adminUid = null;
    login.hidden = false;
    adminTools.hidden = true;
    if (!user || user.isAnonymous) return;
    adminMessage.textContent = "Проверяем доступ…";
    try {
      await withDeadline(db.get(admin));
      if (version !== accountVersion || auth.currentUser?.uid !== user.uid) return;
      adminUid = user.uid;
      login.hidden = true;
      adminTools.hidden = false;
      adminMessage.textContent = "";
    } catch (error) {
      if (version !== accountVersion || auth.currentUser?.uid !== user.uid) return;
      const denied = /permission.denied/i.test(String(error.code || error.message));
      adminMessage.textContent = denied
        ? "Нет доступа к панели. Проверь UID администратора в правилах Firebase."
        : "Firebase не ответил при проверке доступа. Попробуй ещё раз.";
    }

  authSdk.onAuthStateChanged(auth, user => {
    if (!signingIn) void checkAccess(user);
  });
  login.onsubmit = async event => {
    event.preventDefault();
    if (signingIn) return;
    const fields = new FormData(login);
    ++accountVersion;
    signingIn = submit.disabled = true;
    adminMessage.textContent = "Вход…";
    try {
      const { user } = await withDeadline(authSdk.signInWithEmailAndPassword(
        auth, fields.get("email").trim(), fields.get("password")));
      await checkAccess(user);
    } catch (error) {
      if (error.message === "deadline" || error.code === "auth/network-request-failed") {
        adminMessage.textContent = "Firebase не ответил при входе. Проверь подключение и попробуй снова.";
      } else if (error.code === "auth/too-many-requests") {
        adminMessage.textContent = "Слишком много попыток. Попробуй позже.";
      } else if (error.code === "auth/operation-not-allowed") {
        adminMessage.textContent = "В Firebase отключён вход по почте и паролю.";
      } else {
        adminMessage.textContent = "Не удалось войти. Проверь почту и пароль.";
      }
    } finally {
      login.elements.password.value = "";
      signingIn = submit.disabled = false;
    }
  };

    try {
      await authSdk.signOut(auth);
      await authSdk.signInAnonymously(auth);
      adminMessage.textContent = "";
    } catch {
      adminMessage.textContent = "Не удалось восстановить гостевой вход";
    }
  };
  clearBoard.onclick = async () => {
    if (!adminUid || auth.currentUser?.uid !== adminUid) return;
    if (!confirm("Удалить все рисунки с общей доски для всех участников?")) return;
    clearBoard.disabled = true;
    try {
      await db.remove(db.ref(database, "whiteboard/actions"));
      adminMessage.textContent = "Общая доска очищена";
    } catch {
      adminMessage.textContent = "Не удалось очистить доску. Проверь правила Firebase";
    } finally {
      clearBoard.disabled = false;
    }
  };
}
