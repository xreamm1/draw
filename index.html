<!doctype html>
<!-- Для общей доски включите анонимный вход в Firebase Authentication и разрешите чтение /whiteboard/actions. Запись ограничивается владельцем действия через правила Realtime Database. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Общая доска</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: white; color: #182230; font: 14px system-ui, sans-serif }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-touch-callout: none; cursor: crosshair }
  #timeline:not([hidden]) { display: grid; gap: 6px; position: fixed; bottom: 0; left: 0; right: 0;
    padding: 6px max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    background: #20232b; color: #f5f6f8; z-index: 2 }
  .timeline-controls { display: flex; align-items: center; gap: 5px; overflow-x: auto; white-space: nowrap }
  .timeline-controls button, #frame-track button { color: inherit; background: #353944; min-height: 34px }
  #frame-track { display: flex; overflow-x: auto; gap: 3px }
  #frame-track button { flex: 0 0 50px; border-radius: 3px }
  #frame-track button[aria-current="step"] { background: #176bbb; border-color: #8ec7ff }
  #frame-track button[data-drawn]::before { content: "◆ "; font-size: 9px }
  #animation-fps { width: 45px; font: inherit }
  #animation-toggle, #layers-button { pointer-events: auto }
  #layer-list { display: grid; gap: 5px; margin-block: 8px }
  .layer-row { display: flex; gap: 6px }
  .layer-row button:first-child { flex: 1; text-align: left }
  #layers-button { white-space: nowrap }
  body.animation-mode footer { bottom: calc(104px + env(safe-area-inset-bottom)) }
  body.animation-mode #scheme-playback { bottom: calc(152px + env(safe-area-inset-bottom)) }
  body.focus-mode #timeline { display: none }
  @media (pointer: coarse), (max-width: 540px) {
    body.animation-mode footer { bottom: auto }
    body.animation-mode header { bottom: calc(104px + env(safe-area-inset-bottom)) }
    body.animation-mode #scheme-playback { bottom: auto }
  }
  #brush-preview { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    border: 1px solid #243146; box-shadow: 0 0 0 1px #fff; border-radius: 50%; pointer-events: none; z-index: 1 }
  #brush-preview span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #243146; color: white; padding: 2px 6px; border-radius: 4px; white-space: nowrap; font-size: 12px }

  #scheme-playback:not([hidden]) { position: fixed; right: max(12px, env(safe-area-inset-right));

  #scheme-time { width: clamp(80px, 30vw, 220px) }
  @media (pointer: coarse), (max-width: 540px) {
    #scheme-playback:not([hidden]) { top: calc(58px + env(safe-area-inset-top)); bottom: auto }
  }
  dialog { max-width: min(420px, calc(100% - 24px)); border: 1px solid #d9e0e8;
    border-radius: 12px; color: inherit; padding: 16px }
  dialog::backdrop { background: #18223055 }
  dialog h2 { margin: 0 0 12px; font-size: 18px }

  dialog [hidden] { display: none !important }
  dialog label { display: grid; padding: 0 }
  dialog input { width: 100%; font: inherit; min-height: 36px; padding-inline: 8px }
  #admin-message { min-height: 1.4em; margin: 8px 0 }
  #status { pointer-events: auto; touch-action: manipulation; min-height: 32px; background: #fff; border: 1px solid #d9e0e8 }
  canvas.pan { cursor: grab }
  canvas.drag { cursor: grabbing }
  header { position: fixed; top: 12px; left: 12px; right: 12px; pointer-events: none }
  nav { width: fit-content; max-width: 100%; display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px; padding: 8px; background: #fff; border: 1px solid #d9e0e8;
    border-radius: 12px; box-shadow: 0 4px 18px #18223018; pointer-events: auto }
  button { font: inherit; color: inherit; background: #f3f5f8; border: 1px solid transparent;
    border-radius: 7px; min-height: 36px; padding: 4px 9px; cursor: pointer }
  button[aria-pressed="true"] { color: #fff; background: #194c9e }
  label { display: flex; align-items: center; gap: 5px; padding: 0 4px }
  input[type="range"] { width: 75px }
  input[type="color"] { width: 35px; height: 34px }
  footer { position: fixed; bottom: 12px; left: 12px; right: 12px; pointer-events: none;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px }
  footer > span { background: #fff; border: 1px solid #d9e0e8; border-radius: 8px; padding: 6px 9px }
  header, footer { left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)) }
  header { top: max(12px, env(safe-area-inset-top)) }
  footer { bottom: max(12px, env(safe-area-inset-bottom)) }
  button:disabled { opacity: .5; cursor: default }
  .tool-icon, #fullscreen { display: none }
  body.focus-mode header, body.focus-mode footer > span, body.focus-mode #status { display: none }
  body.focus-mode footer { justify-content: flex-end }
  #name-button { pointer-events: auto; background: white; border-color: #d9e0e8; min-height: 44px }
  #author-tip { position: fixed; z-index: 1; pointer-events: none; background: #182230; color: white;
    padding: 5px 8px; border-radius: 6px; max-width: min(220px, calc(100vw - 16px)); overflow-wrap: anywhere }
  #remote-cursors { position: fixed; inset: 0; overflow: hidden; pointer-events: none }
  .remote-cursor { position: absolute; top: 0; left: 0; white-space: nowrap; font-size: 12px;
    color: white; background: #194c9e; padding: 3px 6px; border-radius: 6px; margin: 5px }
  .remote-cursor::before { content: "↖ "; }
  .remote-cursor.touch::before { content: "● "; }
  .view-buttons { display: flex; align-items: center; gap: 5px }
  body.focus-mode #name-button { display: none }
  #fullscreen { pointer-events: auto; touch-action: manipulation; background: white;
    border-color: #d9e0e8; min-width: 44px; font-size: 20px }
  @media (pointer: coarse), (max-width: 540px) {
    header { top: auto; bottom: max(8px, env(safe-area-inset-bottom)); left: 0; right: 0;
      padding-inline: max(6px, env(safe-area-inset-left)) max(6px, env(safe-area-inset-right)) }
    nav { width: fit-content; margin-inline: auto; gap: 3px; padding: 4px; justify-content: center }
    nav button { flex: 0 0 44px; width: 44px; min-height: 44px; padding: 0 }
    nav label { min-height: 44px }
    .tool-icon { display: block; margin: auto; width: 22px; height: 22px; fill: none;

    .tool-text, footer > span { display: none }

    #status, #fullscreen { min-height: 44px }
    #fullscreen { display: inline-block }

<header>

<footer>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyCW1He4AAsxS07cYvlqHLD9TVF2t47UQ-I",
  authDomain: "draw-ccfc3.firebaseapp.com",
  projectId: "draw-ccfc3",
  storageBucket: "draw-ccfc3.firebasestorage.app",
  messagingSenderId: "1016096611827",
  appId: "1:1016096611827:web:d66c427fdcc36236d94686",
  databaseURL: "https://draw-ccfc3-default-rtdb.europe-west1.firebasedatabase.app"
};

const board = document.querySelector("#board");
const ctx = board.getContext("2d", { alpha: false });
const color = document.querySelector("#color");
const size = document.querySelector("#size");
const brushPreview = document.querySelector("#brush-preview");
let brushPreviewTimer = 0;
size.addEventListener("input", () => {
  const width = toolSize();
  const maxPreview = Math.min(board.clientWidth, board.clientHeight) * .84;
  const diameter = Math.max(2, Math.min(maxPreview, width * camera.zoom));
  brushPreview.style.width = brushPreview.style.height = diameter + "px";
  brushPreview.firstElementChild.textContent = width + " px";
  brushPreview.hidden = false;
  clearTimeout(brushPreviewTimer);
  brushPreviewTimer = setTimeout(() => { brushPreview.hidden = true; }, 850);
});

function toolSize() {
  return tool === "blur" ? Math.min(80, Number(size.value)) : Number(size.value);
}
const status = document.querySelector("#status");
const buttons = document.querySelectorAll("[data-tool]");
const undoButton = document.querySelector("#undo");
const undoHistory = [];
const opacity = document.querySelector("#opacity");
let shareCursor = () => {};
let touchCursorHide = 0;
const cursorLayer = document.querySelector("#remote-cursors");
const remoteCursors = new Map();

function positionCursors() {
  for (const { marker, data } of remoteCursors.values()) {
    const [x, y] = view([data.x, data.y]);
    marker.style.transform = `translate(${x}px,${y}px)`;
    marker.hidden = animationMode || Date.now() - data.updated > 15000;
  }
}

function connectCursors(db, database, authSdk, auth) {
  const cursors = db.ref(database, "whiteboard/cursors");
  let own = null, online = false, enabled = false, timer = 0;
  let pending = null, connectionVersion = 0;
  const forget = id => {
    remoteCursors.get(id)?.marker.remove();
    remoteCursors.delete(id);
  };
  const update = snapshot => {
    const data = snapshot.val();
    if (snapshot.key === own?.key || ![data?.x, data?.y, data?.updated].every(Number.isFinite)) {
      forget(snapshot.key);
      return;
    }
    const marker = remoteCursors.get(snapshot.key)?.marker || document.createElement("span");
    marker.className = data.touch ? "remote-cursor touch" : "remote-cursor";
    marker.textContent = cleanName(data.name) || "Гость";
    if (!marker.parentNode) cursorLayer.append(marker);
    remoteCursors.set(snapshot.key, { marker, data });
    positionCursors();
  };
  db.onChildAdded(cursors, update, () => {});
  db.onChildChanged(cursors, update, () => {});
  db.onChildRemoved(cursors, s => forget(s.key), () => {});
  setInterval(positionCursors, 3000);

  function attach() {
    const version = ++connectionVersion;
    enabled = false;
    if (!online || !auth.currentUser) return;
    own = db.push(cursors);
    db.onDisconnect(own).remove().then(() => {
      if (version === connectionVersion) enabled = true;
    }).catch(() => {});
  }
  db.onValue(db.ref(database, ".info/connected"), s => {
    online = s.val() === true;
    attach();
  });
  authSdk.onAuthStateChanged(auth, () => {
    if (enabled && own) db.remove(own).catch(() => {});
    attach();
  });
  shareCursor = (point, touch = false) => {
    if (!enabled || !own || (point && animationMode)) return;
    if (!point) {
      clearTimeout(timer);
      timer = 0;
      pending = null;
      db.remove(own).catch(() => {});
      return;
    }
    const [x, y] = world(point);
    pending = { x, y, touch, name: displayName || "Гость" };
    if (!timer) timer = setTimeout(() => {
      timer = 0;
      const owner = auth.currentUser?.uid;
      if (enabled && owner && pending) {
        db.set(own, { ...pending, owner, updated: db.serverTimestamp() }).catch(() => {});
      }
    }, 80);
  };
}
const nameButton = document.querySelector("#name-button");
const namePanel = document.querySelector("#name-panel");
const nameInput = document.querySelector("#display-name");
const authorTip = document.querySelector("#author-tip");
let displayName = "";
try { displayName = cleanName(localStorage.getItem("whiteboard-name")); } catch {}
nameButton.onclick = () => {
  nameInput.value = displayName;
  namePanel.returnValue = "";
  namePanel.showModal();
};
namePanel.querySelector("form").onsubmit = event => {
  if (event.submitter?.value === "cancel") return;
  displayName = cleanName(nameInput.value);
  try { localStorage.setItem("whiteboard-name", displayName); } catch {}
};

function cleanName(value) {
  return typeof value === "string" ? value.replace(/\s+/g, " ").trim().slice(0, 32) : "";
}
let undoing = false;
const camera = { x: 0, y: 0, zoom: 1, angle: 0, cos: 1, sin: 0 };
const actions = new Map();
const sharedLayers = { count: 1, selected: 0, hidden: new Set() };
const animationLayers = { count: 1, selected: 0, hidden: new Set() };
const layersPanel = document.querySelector("#layers-panel");
const layerList = document.querySelector("#layer-list");
const layerAdd = document.querySelector("#layer-add");
const maxLayers = 8;
const layerCanvases = new Map();

function currentLayers() { return animationMode ? animationLayers : sharedLayers; }

function updateLayers() {
  const layers = currentLayers();
  layerAdd.disabled = layers.count >= maxLayers;
  const rows = [];
  for (let index = layers.count - 1; index >= 0; index--) {
    const row = document.createElement("div");
    row.className = "layer-row";
    const select = document.createElement("button");
    select.type = "button";
    select.textContent = index === 0 ? "Базовый слой" : "Слой " + (index + 1);
    select.setAttribute("aria-pressed", String(index === layers.selected));
    select.onclick = () => {
      layers.selected = index;
      if (layers.hidden.delete(index)) redraw();
      updateLayers();
    };
    const visibility = document.createElement("button");
    visibility.type = "button";
    visibility.textContent = layers.hidden.has(index) ? "Показать" : "Скрыть";
    visibility.setAttribute("aria-label", visibility.textContent + " " + select.textContent.toLowerCase());
    visibility.onclick = () => {
      if (!layers.hidden.delete(index)) layers.hidden.add(index);
      redraw();
      updateLayers();
    };
    row.append(select, visibility);
    rows.push(row);
  }
  layerList.replaceChildren(...rows);
}
document.querySelector("#layers-button").onclick = () => { updateLayers(); layersPanel.showModal(); };
layerAdd.onclick = () => {
  const layers = currentLayers();
  if (layers.count >= maxLayers) return;
  layers.selected = layers.count++;
  redraw();
  updateLayers();
  if (animationMode) saveAnimation();
};
const animationToggle = document.querySelector("#animation-toggle");
const timeline = document.querySelector("#timeline");
const frameTrack = document.querySelector("#frame-track");
const fpsInput = document.querySelector("#animation-fps");
const animationPlay = document.querySelector("#animation-play");
const frameDelete = document.querySelector("#frame-delete");
const animationPosition = document.querySelector("#animation-position");
const animationSaveStatus = document.querySelector("#animation-save-status");
let animationMode = false, frameIndex = 0, playback = 0, saveTimer = 0;
let animationStore;
let animationFrames = [{ actions: new Map(), undo: [] }];

function activeActions() {
  return animationMode ? animationFrames[frameIndex].actions : actions;
}

function activeUndo() {
  return animationMode ? animationFrames[frameIndex].undo : undoHistory;
}

function openAnimationStore() {
  if (!animationStore) animationStore = new Promise((resolve, reject) => {
    const request = indexedDB.open("draw-animation", 1);
    request.onupgradeneeded = () => request.result.createObjectStore("projects");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("storage blocked"));
  });
  return animationStore;
}

let animationLoaded = false;
async function loadAnimation() {
  if (animationLoaded) return;
  animationLoaded = true;
  try {
    const database = await openAnimationStore();
    const data = await new Promise((resolve, reject) => {
      const request = database.transaction("projects").objectStore("projects").get("local");
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    if (!data?.frames?.length) return;
    animationFrames = data.frames.map(entries => {
      const frame = { actions: new Map(), undo: [] };
      for (const action of entries) {
        const id = "~" + String(++localId).padStart(12, "0");
        receive(id, action, null, frame.actions);
      }
      return frame;
    });
    fpsInput.value = data.fps || 8;
    if (Number.isInteger(data.layerCount)) {
      animationLayers.count = Math.max(animationLayers.count, Math.min(maxLayers, data.layerCount));

    const shared = ids.filter(id => !id.startsWith("~"));
    if (shared.length) await deleteActions(shared);
    for (const id of ids) if (id.startsWith("~")) remove(id, destination);
    if (destination !== actions) {

async function connect() {
  if (!firebaseConfig.databaseURL) { status.textContent = "Локальная доска · Укажи databaseURL"; return; }
  try {
    const authModule = import("https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js");
    const [{ initializeApp }, db] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js")
    ]);
    const app = initializeApp(firebaseConfig);
    const database = db.getDatabase(app);
    let auth;
    const log = db.ref(database, "whiteboard/actions");
    let ready = false, online = false, denied = false, writeError = false;
    const report = () => {
      status.textContent = denied ? "Локальная доска · Доступ к базе закрыт" : writeError ? "Не удалось сохранить изменение"
        : !ready ? "Загрузка общей доски…" : online ? "Общая доска · В сети" : "Нет связи · Изменения в очереди";
    };
    const fail = () => { loading = false; denied = true; writeAction = null; report(); };
    db.onValue(db.ref(database, ".info/connected"), s => { online = s.val(); report(); });

    const history = [];
    let nextAction = 0;

      if (change === "remove") remove(snapshot.key);
      else if (change === "change" || !actions.has(snapshot.key)) receive(snapshot.key, snapshot.val());
    }

    function drainHistory() {
      queueFrame = 0;
      const deadline = performance.now() + 5;
      do {
        const [change, snapshot] = history[nextAction++];
        applyHistoryChange(change, snapshot);
      } while (nextAction < history.length && performance.now() < deadline);
      if (nextAction < history.length) queueFrame = requestAnimationFrame(drainHistory);
      else {
        history.length = nextAction = 0;
        if (initialReceived) {
          historyReady = true;
          enableDrawing();
        }
      }
    }

    function handle(change, snapshot) {
      if (historyReady) {
        applyHistoryChange(change, snapshot);
      } else {
        history.push([change, snapshot]);
        if (!queueFrame) queueFrame = requestAnimationFrame(drainHistory);
      }

    db.onChildChanged(log, s => handle("change", s), fail);
    db.onChildRemoved(log, s => handle("remove", s), fail);

      initialReceived = true;
      if (!queueFrame) {
        historyReady = true;
        enableDrawing();
      }
    }, fail, { onlyOnce: true });

    function enableDrawing() {
      if (ready || denied || !guestReady || !historyReady) return;
      loading = false;
      ready = true;
      writeAction = (action, image) => {
        const item = db.push(log);
        receive(item.key, action, image);
        const owner = auth.currentUser?.uid;
        db.set(item, owner ? { ...action, owner } : action).then(() => { writeError = false; report(); }).catch(() => {
          remove(item.key);
          writeError = true;
          report();
        });

      };
      deleteActions = ids => db.update(log, Object.fromEntries(ids.map(id => [id, null])));
      report();
    }

    const authSdk = await authModule;
    auth = authSdk.getAuth(app);
    await auth.authStateReady();
    if (!auth.currentUser) await authSdk.signInAnonymously(auth).catch(() => {});
    configurePanel(authSdk, auth, db, database);
    connectCursors(db, database, authSdk, auth);
    guestReady = true;
    enableDrawing();

    loading = false;
    status.textContent = "Локальная доска · Firebase недоступен";
  }

function configurePanel(authSdk, auth, db, database) {
  const admin = db.ref(database, "adminUid");
  let adminUid = null;
  let accountVersion = 0;
  adminAvailable = true;
  adminMessage.textContent = "";
  let signingIn = false;
  const submit = login.querySelector("button");

  async function withDeadline(request) {
    let timer;
    try {
      return await Promise.race([
        request,
        new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error("deadline")), 12000);
        })
      ]);
    } finally {
      clearTimeout(timer);
    }
  }

  async function checkAccess(user) {
    const version = ++accountVersion;
    adminUid = null;
    login.hidden = false;
    adminTools.hidden = true;
    if (!user || user.isAnonymous) return;
    adminMessage.textContent = "Проверяем доступ…";
    try {
      await withDeadline(db.get(admin));
      if (version !== accountVersion || auth.currentUser?.uid !== user.uid) return;
      adminUid = user.uid;
      login.hidden = true;
      adminTools.hidden = false;
      adminMessage.textContent = "";
    } catch (error) {
      if (version !== accountVersion || auth.currentUser?.uid !== user.uid) return;
      const denied = /permission.denied/i.test(String(error.code || error.message));
      adminMessage.textContent = denied
        ? "Нет доступа к панели. Проверь UID администратора в правилах Firebase."
        : "Firebase не ответил при проверке доступа. Попробуй ещё раз.";
    }
  }

  authSdk.onAuthStateChanged(auth, user => {
    if (!signingIn) void checkAccess(user);
  });
  login.onsubmit = async event => {
    event.preventDefault();
    if (signingIn) return;
    const fields = new FormData(login);
    ++accountVersion;
    signingIn = submit.disabled = true;
    adminMessage.textContent = "Вход…";
    try {
      const { user } = await withDeadline(authSdk.signInWithEmailAndPassword(
        auth, fields.get("email").trim(), fields.get("password")));
      await checkAccess(user);
    } catch (error) {
      if (error.message === "deadline" || error.code === "auth/network-request-failed") {
        adminMessage.textContent = "Firebase не ответил при входе. Проверь подключение и попробуй снова.";
      } else if (error.code === "auth/too-many-requests") {
        adminMessage.textContent = "Слишком много попыток. Попробуй позже.";
      } else if (error.code === "auth/operation-not-allowed") {
        adminMessage.textContent = "В Firebase отключён вход по почте и паролю.";
      } else {
        adminMessage.textContent = "Не удалось войти. Проверь почту и пароль.";
      }
    } finally {
      login.elements.password.value = "";
      signingIn = submit.disabled = false;
    }
  };
  document.querySelector("#sign-out").onclick = async () => {
    try {
      await authSdk.signOut(auth);
      await authSdk.signInAnonymously(auth);
      adminMessage.textContent = "";
    } catch {
      adminMessage.textContent = "Не удалось восстановить гостевой вход";
    }
  };
  clearBoard.onclick = async () => {
    if (!adminUid || auth.currentUser?.uid !== adminUid) return;
    if (!confirm("Удалить все рисунки с общей доски для всех участников?")) return;
    clearBoard.disabled = true;
    try {
      await db.remove(db.ref(database, "whiteboard/actions"));
      adminMessage.textContent = "Общая доска очищена";
    } catch {
      adminMessage.textContent = "Не удалось очистить доску. Проверь правила Firebase";
    } finally {
      clearBoard.disabled = false;
    }
  };
}

  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.code === "KeyZ") {
    e.preventDefault();
    if (!e.repeat) undo();
    return;
  }
  if (e.code !== "Space" || e.target.closest?.("button, input")) return;
  e.preventDefault();
  space = true;
  cursor();
});
addEventListener("keyup", e => { if (e.code === "Space") { space = false; cursor(); } });
addEventListener("blur", () => {
  endStroke(Boolean(stroke?.last));
  space = false;
  pan = gesture = null;
  touches.clear();
  clearTimeout(touchCursorHide);
  shareCursor(null);
  touchNavigation = false;
  cursor();
});
addEventListener("resize", resize);
resize();
connect();
</script>
